<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動作確認</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 3rem 1rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 640px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .badge {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #6ee7b7;
            border-radius: 50%;
            box-shadow: 0 0 8px #6ee7b7;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.5rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            background: linear-gradient(135deg, #6d28d9, #4f46e5);
            color: #fff;
            box-shadow: 0 4px 15px rgba(99, 60, 220, 0.4);
            margin-bottom: 2rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 60, 220, 0.55);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        .section-label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 0.75rem;
        }

        .count-pill {
            display: inline-block;
            background: rgba(99, 102, 241, 0.25);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.1rem 0.6rem;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        .table-wrap {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead tr {
            background: rgba(255, 255, 255, 0.06);
        }

        thead th {
            padding: 0.75rem 1rem;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #94a3b8;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        tbody tr {
            transition: background 0.15s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        tbody tr:not(:last-child) td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tbody td {
            padding: 0.7rem 1rem;
            font-size: 0.88rem;
            color: #cbd5e1;
            font-variant-numeric: tabular-nums;
        }

        tbody tr:first-child td {
            color: #6ee7b7;
            font-weight: 600;
        }

        .empty {
            text-align: center;
            padding: 2rem;
            color: #475569;
            font-size: 0.85rem;
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.72rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="badge"></span>
            <h1>動作確認ダッシュボード</h1>
        </div>

        <a class="btn" href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12l7-7 7 7"/>
            </svg>
            Push!
        </a>

        <div class="section-label">
            アクセスログ
            <span class="count-pill">{{ times|length }} 件</span>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Timestamp (JST)</th>
                    </tr>
                </thead>
                <tbody>
                    {% if times %}
                        {% for t in times %}
                        <tr>
                            <td>{{ loop.index }}</td>
                            <td>{{ t.decode('utf-8') }}</td>
                        </tr>
                        {% endfor %}
                    {% else %}
                        <tr>
                            <td colspan="2" class="empty">まだ記録がありません。Push! してください。</td>
                        </tr>
                    {% endif %}
                </tbody>
            </table>
        </div>

        <div class="footer">Flask + Redis on Docker Compose</div>
    </div>
</body>
</html>
